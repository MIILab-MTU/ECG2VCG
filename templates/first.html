        <div id="rhLeftBottom">
          <div id="rhBLeft" align="center">

              <div id="work">

  <script type="text/javascript">
    var canvas = document.querySelector("canvas");
    var ctx = canvas.getContext("2d");
    var orangeX = 0;

    var redX = 0;
    var redY = 0;
    var yellowX = 0;
    var yellowY = 0;
    var blueX = 0;
    var blueY = 0;
    var color = "";
    var data = [];
    document.getElementById("onsetOfQrs").onclick = function () {

    }
    document.getElementById("R_peak").onclick = function () {

      document.getElementById("img1").innerHTML="<img src='../static/image/circle.png' style=\"width: 8px;height: 8px\">"
      document.getElementById("img3").innerHTML="<img src='../static/image/circle.png' style=\"width: 8px;height: 8px\">"

      document.getElementById("img5").innerHTML="<img src='../static/image/circle.png' style=\"width: 8px;height: 8px\">";
    }
    document.getElementById("onsetOfST").onclick = function () {
      color = "red";
      document.getElementById("img3").innerHTML="<img src='../static/image/redCircle.png' style=\"width: 8px;height: 8px\">";
      document.getElementById("img1").innerHTML="<img src='../static/image/circle.png' style=\"width: 8px;height: 8px\">"
      document.getElementById("img2").innerHTML="<img src='../static/image/circle.png' style=\"width: 8px;height: 8px\">"
      document.getElementById("img4").innerHTML="<img src='../static/image/circle.png' style=\"width: 8px;height: 8px\">"
      document.getElementById("img5").innerHTML="<img src='../static/image/circle.png' style=\"width: 8px;height: 8px\">";
    }
    document.getElementById("T_peak").onclick = function () {
      color = "yellow";
      document.getElementById("img4").innerHTML="<img src='../static/image/yellowCircle.png' style=\"width: 8px;height: 8px\">";
      document.getElementById("img1").innerHTML="<img src='../static/image/circle.png' style=\"width: 8px;height: 8px\">"
      document.getElementById("img2").innerHTML="<img src='../static/image/circle.png' style=\"width: 8px;height: 8px\">"
      document.getElementById("img3").innerHTML="<img src='../static/image/circle.png' style=\"width: 8px;height: 8px\">"
      document.getElementById("img5").innerHTML="<img src='../static/image/circle.png' style=\"width: 8px;height: 8px\">";
    }
    document.getElementById("T_end").onclick = function () {
      color = "blue";
      document.getElementById("img5").innerHTML="<img src='../static/image/blueCircle.png' style=\"width: 8px;height: 8px\">";
      document.getElementById("img1").innerHTML="<img src='../static/image/circle.png' style=\"width: 8px;height: 8px\">";
      document.getElementById("img2").innerHTML="<img src='../static/image/circle.png' style=\"width: 8px;height: 8px\">"
      document.getElementById("img3").innerHTML="<img src='../static/image/circle.png' style=\"width: 8px;height: 8px\">"
      document.getElementById("img4").innerHTML="<img src='../static/image/circle.png' style=\"width: 8px;height: 8px\">";
    }
    {#var eraser = document.getElementById("eraser");#}
    {#eraser.onclick = function(){#}

    {#  // Add a mouse-up event to the canvas.#}
    {#  canvas.onmouseup = function(){#}

    var clear = document.getElementById("clear");
    clear.onclick = function () {
      ctx.clearRect(0, 0, 860, 430);
      orangeX = 0;
      orangeY = 0;
      greenX = 0;
      greenY = 0;
      redX = 0;
      redY = 0;
      yellowX = 0;
      yellowY = 0;
      blueX = 0;
      blueY = 0;
    }

    canvas.onmousedown = function () {
      drawPoint(event);
      document.onmouseup = function () {
        //Gets all of the graph data in a specified area of the canvas
        data.push(ctx.getImageData(0, 0, 860, 430));
        canvas.onmousemove = null;
        document.onmouseup = null;
      }
    }
    var reBack = document.getElementById("return");
    reBack.onclick = function() {
      if (data.length == 0) {
        alert("Invalid operation!!!");
        return;
      }
      ctx.clearRect(0, 0, 860, 430);
      data.pop();
      if (data.length == 0) {
        return;
      }
      ctx.putImageData(data[data.length - 1], 0, 0, 0, 0, 860, 430);
    }
    function drawPoint(e) {
      if (color == "orange") {
        ctx.clearRect(orangeX-3,orangeY-3,6,6)
        ctx.beginPath();
        ctx.arc(e.offsetX,e.offsetY,3,0,360,false);
        ctx.fillStyle="#ff7f0e";
        ctx.fill();
        ctx.closePath();
        // ctx.fill();
        orangeX = Math.abs(e.offsetX);
        orangeY = Math.abs(e.offsetY);
        console.log(orangeX, orangeY);
      }
      if (color == "green") {
        ctx.clearRect(greenX-3,greenY-3,6,6);
        ctx.beginPath();
        ctx.arc(e.offsetX,e.offsetY,3,0,360,false);
        ctx.fillStyle="#2ca02c";
        ctx.fill();
        ctx.closePath();
        greenX = Math.abs(e.offsetX);
        greenY = Math.abs(e.offsetY);
        console.log(greenX, greenY);
      }
      if (color == "red") {
        ctx.clearRect(redX-3,redY-3,6,6);
        ctx.beginPath();
        ctx.arc(e.offsetX,e.offsetY,3,0,360,false);
        ctx.fillStyle="#d62728";
        ctx.fill();
        ctx.closePath();
        redX = Math.abs(e.offsetX);
        redY = Math.abs(e.offsetY);
        console.log(redX, redY);
      }
      if (color == "yellow") {
        ctx.clearRect(yellowX-3,yellowY-3,6,6)
        ctx.beginPath();
        ctx.arc(e.offsetX,e.offsetY,3,0,360,false);
        ctx.fillStyle="#bcbd22";
        ctx.fill();
        ctx.closePath();
        yellowX = Math.abs(e.offsetX);
        yellowY = Math.abs(e.offsetY);
        console.log(yellowX, yellowY);
      }
      if (color == "blue") {
        ctx.clearRect(blueX-3,blueY-3,6,6)
        ctx.beginPath();
        ctx.arc(e.offsetX,e.offsetY,3,0,360,false);
        ctx.fillStyle="#1f77b4";
        ctx.fill();
        ctx.closePath();
        blueX = Math.abs(e.offsetX);
        blueY = Math.abs(e.offsetY);
        console.log(blueX, blueY);
      }
    }
    document.getElementById("save").onclick = function () {
       {#Save the points retrieved on the canvas as a JSON file.#}
      var points = [
        {"firstX": orangeX, "firstY": orangeY},
        {"secondX": greenX, "secondY": greenY},
        {"thirdX": redX, "thirdY": redY},
        {"fourthX": yellowX, "fourthY": yellowY},
        {"fifthX": blueX, "fifthY": blueY}
      ]
      {#Ajax transfers the JSON file from the storage point to the background.#}
      $.ajax({
        type: 'POST',
        url: '../first/',
        {#data: points,#}
        data:  JSON.stringify(points),
        processData: false,
        contentType: "application/json",
        error: function (request) {
          console.log(points);
        },
        success: function (result) {
            console.log("success");
        }
      });
      ctx.clearRect(0, 0, 860, 430);
        document.getElementById("demoANext").onclick = function () {
            return true;
        }
        document.getElementById("coloring").onclick = function () {
          var bg = "../static/Img_From_File/Color_VCG.png";
          $(canvas).css("background","url("+bg+")");
          $(canvas).css("background-color","#f3f0f0");
          canvas.style.backgroundSize = "860px 430px";
        }
    }
    document.getElementById("coloring").onclick = function () {
        alert("Please save the label first !");
        return false;
    }

    document.getElementById("demoANext").onclick = function (){
        alert("Please save the label before clicking 'Next'!");
