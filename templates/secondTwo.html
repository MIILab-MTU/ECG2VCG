<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Data Acquisition Display</title>
  <link rel="stylesheet" type="text/css" href="../static/layui-v2.5.7/layui/css/layui.css" media="all">
  <script type="text/javascript" src="../static/layui-v2.5.7/layui/layui.js"></script>
  <style>
    body{
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    #top{
      /*background-color: #5FB878;*/
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #center{
      /*background-color: #00FFFF;*/
      {#flex-grow: 1;#}
      height: 550px;
      display: flex;
      flex-direction: row;
    }
    #centerL{
      /*background-color: #8D8D8D;*/
      width: 70%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #centerR{
      /*background-color: #4E5465;*/
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
    }
    #inputDiv{
      display: flex;
      flex-direction: column;
    }
    .input{
      width: 330px;
      border: 1px grey solid;
    }
    .next{
      width: 160px;
      height: 35px;
      background-color: #4472c4;
      font-size: 16px;
      color: white;
    }
    #footer{
      flex-grow: 1;
    }
  </style>
</head>
<body>
  <div id="top">
    <p style="font-size: 35px;font-weight: bold">VCG</p>
  </div>
  <div id="center">
    <div id="centerL">
      <img src="../static/Img_From_File/VCG_blue.png" style="width: 870px;height: 524px" alt="No File Uploaded">
      <div style="height: 50px"></div>
    </div>
    <div id="centerR">
      <h2>The latest electrical contracting segment:</h2><br/>
      <div id="inputDiv">
        <input type="text" name="segment1" lay-verify="title" autocomplete="off" class="layui-input input" id="segment1" value="{{ msg1 }}"><br/>
        <input type="text" name="segment2" lay-verify="title" autocomplete="off" class="layui-input input" id="segment2" value="{{ msg2 }}">
      </div><br/>
      <div>
        <a href="/first"><button id="Back" class="next">Back</button></a>
        <a href="../static/Result_File/Result.json" download="Result.json"><button  class="next">Save</button></a>
      </div><br/>
    </div>
  </div>
  <div id="footer"></div>
</body>
</html>
